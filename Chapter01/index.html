<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management Web</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --text: #222;
      --muted: #666;
      --line: #ddd;
      --primary: #2563eb;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .stats {
      display: grid;
      gap: 12px;
    }
    .stat {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafafa;
    }
    .stat span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat strong {
      font-size: 16px;
    }
    form {
      display: grid;
      gap: 12px;
    }
    .field {
      display: grid;
      gap: 6px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      background: #fff;
    }
    input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.18);
      border-color: var(--primary);
    }
    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111;
    }
    .table-card {
      overflow: hidden;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    th {
      background: #fafafa;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    #status {
      margin-top: 10px;
      color: var(--muted);
      min-height: 20px;
      font-size: 14px;
    }
    .deleteBtn {
      padding: 8px 12px;
      background: rgba(220, 38, 38, 0.08);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 24px 12px;
    }
    .muted {
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Student Management</h1>
      <p>Simple web page connected to the FastAPI backend.</p>
    </header>
    <div class="grid">
      <section class="card">
        <h2>Create Student</h2>
        <form id="studentForm">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" placeholder="Amina Khan" required />
          </div>
          <div class="field">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="0" placeholder="19" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="amina@example.com" />
          </div>
          <div class="buttons">
            <button class="btn-primary" type="submit">Add Student</button>
            <button class="btn-secondary" type="button" id="refreshBtn">Refresh</button>
          </div>
        </form>
        <div id="status">Loading...</div>
      </section>
      <aside class="card">
        <h2>Summary</h2>
        <div class="stats">
          <div class="stat">
            <span>Total Students</span>
            <strong id="metricTotal">0</strong>
          </div>
          <div class="stat">
            <span>API</span>
            <strong>http://127.0.0.1:8000</strong>
          </div>
        </div>
      </aside>
    </div>
    <section class="card table-card">
      <h2>Roster</h2>
      <div class="table-wrap">
        <table aria-label="Students table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const statusEl = document.getElementById("status");
    const bodyEl = document.getElementById("studentsBody");
    const metricTotal = document.getElementById("metricTotal");

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function renderEmptyRow() {
      bodyEl.innerHTML = `
        <tr class="empty-row">
          <td colspan="4">No students found.</td>
        </tr>
      `;
    }

    async function loadStudents() {
      setStatus("Loading...");
      const response = await fetch(`${API_BASE}/students`);
      const students = await response.json();

      metricTotal.textContent = students.length;
      bodyEl.innerHTML = "";

      if (!students.length) {
        renderEmptyRow();
        setStatus("No students yet.");
        return;
      }

      students.forEach((student) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(student.name)}</td>
          <td>${student.age ?? "<span class='muted'>-</span>"}</td>
          <td>${escapeHtml(student.email ?? "-")}</td>
          <td><button data-id="${student.id}" class="deleteBtn" type="button">Delete</button></td>
        `;
        bodyEl.appendChild(row);
      });

      setStatus(`Loaded ${students.length} student(s).`);
    }

    document.getElementById("studentForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        name: document.getElementById("name").value.trim(),
        age: document.getElementById("age").value ? Number(document.getElementById("age").value) : undefined,
        email: document.getElementById("email").value.trim() || undefined
      };

      const response = await fetch(`${API_BASE}/students`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        setStatus("Failed to create student.");
        return;
      }

      event.target.reset();
      await loadStudents();
      setStatus("Student created.");
    });

    document.getElementById("refreshBtn").addEventListener("click", loadStudents);

    bodyEl.addEventListener("click", async (event) => {
      if (!event.target.classList.contains("deleteBtn")) return;

      const id = event.target.dataset.id;
      const response = await fetch(`${API_BASE}/students/${id}`, { method: "DELETE" });

      if (!response.ok && response.status !== 204) {
        setStatus("Failed to delete student.");
        return;
      }

      await loadStudents();
      setStatus("Student deleted.");
    });

    loadStudents().catch(() => {
      metricTotal.textContent = "—";
      renderEmptyRow();
      setStatus("Could not connect to the API.");
    });
  </script>
</body>
</html>
